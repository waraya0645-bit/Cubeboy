name: Import Unity ZIP

on:
  push:
    branches:
      - unity-version
    paths:
      - 'Unity_MyGame_編集しやすい版.zip'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: unity-version

      - name: Extract package
        run: |
          unzip -q 'Unity_MyGame_編集しやすい版.zip' -d /tmp/unity-package
          test -d /tmp/unity-package/unity_mygame/Assets/MyGame
          mkdir -p Assets
          cp -R /tmp/unity-package/unity_mygame/Assets/MyGame Assets/

      - name: Commit Unity files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Assets/MyGame
          if ! git diff --cached --quiet; then
            git commit -m "Add Unity game files"
            git push
          fi
